name: CI-CD

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:

  # ============================================================
  # CI - Build da imagem e Push para OCIR
  # ============================================================
  CI:
    name: CI - Build e Push
    runs-on: ubuntu-latest

    steps:

      - name: Obtendo o código
        uses: actions/checkout@v4

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: gru.ocir.io
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            gru.ocir.io/grglog7bpvjm/primeira-pipeline-cicd:v${{ github.run_number }}
            gru.ocir.io/grglog7bpvjm/primeira-pipeline-cicd:latest


  # ============================================================
  # CD - Deploy no Kubernetes / OKE
  # ============================================================
  CD:
    name: CD - Deploy OKE
    runs-on: ubuntu-latest
    needs: [CI]

    steps:

      - name: Obtendo o código
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Instala OCI CLI
      # --------------------------------------------------------
      # O K8S_CONFIG utiliza o OCI CLI como credential plugin.
      # Sem o "oci" instalado, o kubectl apresenta:
      #
      # executable oci not found
      # --------------------------------------------------------
      - name: Instalar OCI CLI
        run: |
          curl -L -o install.sh \
            https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh

          bash install.sh --accept-all-defaults

          echo "$HOME/bin" >> $GITHUB_PATH


      # --------------------------------------------------------
      # Verifica instalação do OCI CLI
      # --------------------------------------------------------
      - name: Verificar OCI CLI
        run: |
          which oci
          oci --version


      # --------------------------------------------------------
      # Configura credenciais do OCI
      # --------------------------------------------------------
      - name: Configurar OCI CLI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

        run: |
          mkdir -p ~/.oci

          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF


      # --------------------------------------------------------
      # Configuração do contexto Kubernetes
      # --------------------------------------------------------
      - name: Configuração de contexto do Kubernetes
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_CONFIG }}


      # --------------------------------------------------------
      # Testa acesso ao OKE
      # --------------------------------------------------------
      - name: Testar acesso ao Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes


      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------
      - name: Execução do Manifesto
        uses: Azure/k8s-deploy@v5
        with:
          manifests: |
            ./k8s/deployment.yaml

          images: |
            gru.ocir.io/grglog7bpvjm/primeira-pipeline-cicd:v${{ github.run_number }}
